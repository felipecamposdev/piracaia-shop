<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordem de Serviço</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans max-w-md mx-auto">

  <div class="bg-white p-6 rounded-xl shadow-md mt-6">
    <h2 class="text-xl font-bold text-gray-800 mb-4">🛠️ Abertura de O.S.</h2>
    
<form action="https://formspree.io/f/SEU_CODIGO_AQUI" method="POST" enctype="multipart/form-data" class="space-y-4">
  <!-- Seus campos de maquina, tipo e descricao -->
  <input type="text" name="maquina" placeholder="Equipamento" required>
  <textarea name="descricao" placeholder="Descrição" required></textarea>
  
  <!-- O campo de foto anexada funciona nativamente no plano gratuito -->
  <input type="file" name="attachment" accept="image/*" capture="environment">
  
  <button type="submit">Enviar Chamado</button>
</form>
    
    <div id="statusMsg" class="mt-4 text-center text-sm font-medium hidden"></div>
  </div>


<script>
  const URL_DO_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzW_02H2vhV8evwbtVOAbkNyAOWRUG51Nc8atznfVADzZFJ5PqMWJAOPsz9RmpgpfqU/exec";

  document.getElementById('osForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('btnEnviar');
    const status = document.getElementById('statusMsg');
    
    btn.disabled = true;
    btn.innerText = "Enviando...";
    status.classList.remove('hidden');
    status.innerText = "Processando envio e foto...";
    status.className = "mt-4 text-center text-sm text-blue-600 font-medium";

    const fileInput = document.getElementById('fotoInput');
    let fotoBase64 = "";
    let nomeFoto = "";

    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      nomeFoto = file.name;
      fotoBase64 = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    // Criamos um formulário codificado em URL (evita bloqueios do navegador)
    const formData = new URLSearchParams();
    formData.append('maquina', document.getElementById('maquina').value);
    formData.append('tipo', document.getElementById('tipo').value);
    formData.append('descricao', document.getElementById('descricao').value);
    formData.append('fotoBase64', fotoBase64);
    formData.append('nomeFoto', nomeFoto);

    try {
      await fetch(URL_DO_GOOGLE_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData.toString()
      });

      status.innerText = "✅ Ordem de Serviço enviada com sucesso!";
      status.className = "mt-4 text-center text-sm text-green-600 font-medium";
      document.getElementById('osForm').reset();
    } catch (err) {
      status.innerText = "❌ Erro ao enviar. Tente novamente.";
      status.className = "mt-4 text-center text-sm text-red-600 font-medium";
    } finally {
      btn.disabled = false;
      btn.innerText = "Enviar Chamado";
    }
  });
</script>
</body>
</html>
